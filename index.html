<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Win 11</title>
<style>
:root{box-sizing:border-box;--glass:rgba(243,243,243,.82);--win:#fff;--txt:#1b1b1b;--sub:#5d5d5d;--line:rgba(0,0,0,.1);--hover:rgba(0,0,0,.06);--acc:#0067c0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(32,32,32,.82);--win:#2b2b2b;--txt:#f3f3f3;--sub:#b5b5b5;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.09);--acc:#4cc2ff}}
:root[data-theme="dark"]{--glass:rgba(32,32,32,.82);--win:#2b2b2b;--txt:#f3f3f3;--sub:#b5b5b5;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.09);--acc:#4cc2ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--txt);background:#1a3a6e;user-select:none}
#desk{position:fixed;inset:0;background:radial-gradient(circle at 30% 70%,#2f7be0 0,transparent 45%),radial-gradient(circle at 75% 30%,#7b4be0 0,transparent 50%),linear-gradient(135deg,#0b2a66,#1b6fd6 60%,#5ab0ff)}
.ico{display:grid;place-items:center;border-radius:24%;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ico svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icons{position:absolute;top:12px;right:8px;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;max-height:calc(100% - 80px);padding-top:env(safe-area-inset-top,0px)}
.ic{width:84px;padding:8px 4px;text-align:center;color:#fff;font-size:12px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-shadow:0 1px 3px #0009;cursor:default}
.ic:hover{background:rgba(255,255,255,.18)}
.win{position:absolute;background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;min-width:260px;resize:both;max-width:100%}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.tb{display:flex;align-items:center;gap:8px;height:36px;background:var(--glass);cursor:move;padding-inline-start:12px;font-size:13px;touch-action:none}
.tb span{flex:1}
.tb button{width:46px;height:36px;border:0;background:none;color:var(--txt);font-size:14px;cursor:pointer}
.tb button:hover{background:var(--hover)}.tb .x:hover{background:#c42b1c;color:#fff}
.body{flex:1;overflow:auto;user-select:text;display:flex;flex-direction:column;min-height:0}
button.b,.bar button{padding:6px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;font:inherit;font-size:13px}
button.g{background:var(--hover);color:var(--txt)}
input,select{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--win);color:var(--txt);min-width:0}
.bar{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line);align-items:center}.bar input{flex:1}
textarea{flex:1;width:100%;border:0;outline:0;resize:none;padding:12px;background:var(--win);color:var(--txt);font:15px Consolas,monospace}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;direction:ltr}
.calc .scr{grid-column:1/5;text-align:right;font-size:32px;padding:14px 8px;min-height:64px;overflow:hidden}
.calc button{height:46px;border:0;border-radius:6px;background:var(--hover);color:var(--txt);font-size:17px;cursor:pointer}
.calc button:hover{filter:brightness(1.2)}.calc .eq{background:var(--acc);color:#fff}
.pad{padding:16px;display:grid;gap:10px;align-content:start}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--hover)}
.sw{display:flex;gap:6px}.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid var(--line)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:12px}
.fi{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:8px 4px;border-radius:8px;cursor:pointer;text-align:center;word-break:break-all}
.fi:hover{background:var(--hover)}.fi .ico{width:44px;height:44px}
.term{background:#0c0c0c;color:#ddd;font:14px Consolas,monospace;direction:ltr;padding:10px;flex:1;overflow:auto;white-space:pre-wrap;text-align:left}
.term input{width:100%;background:none;border:0;color:#fff;font:inherit;padding:0;outline:0}
.big{font-size:44px;text-align:center;padding:14px;direction:ltr;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px;text-align:center;font-size:13px}
.cal b{color:var(--sub);font-weight:400;font-size:11px}.cal span{padding:8px 0;border-radius:6px}.cal .td{background:var(--acc);color:#fff}
canvas{max-width:100%;background:#fff;touch-action:none;border:1px solid var(--line)}
#start{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:min(560px,96vw);background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:12px;padding:20px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:99999}
#start.on{display:block}
#start input{width:100%;border-radius:20px;padding:10px 14px;margin-bottom:16px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.apps div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:8px;font-size:12px;cursor:pointer}
.apps div:hover{background:var(--hover)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.foot span{display:flex;gap:8px;align-items:center;cursor:pointer}.foot svg{width:18px;height:18px;fill:none;stroke:var(--txt);stroke-width:2;stroke-linecap:round}
#bar{position:absolute;bottom:0;left:0;right:0;height:48px;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;background:var(--glass);backdrop-filter:blur(30px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:4px;z-index:99998}
.tk{min-width:40px;height:38px;display:grid;place-items:center;border-radius:6px;cursor:pointer;position:relative;border:0;background:none}
.tk:hover{background:var(--hover)}.tk.run::after{content:"";position:absolute;bottom:2px;width:12px;height:3px;border-radius:2px;background:var(--acc)}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:20px;height:20px}.logo s{background:var(--acc);border-radius:1px}
.tray{position:absolute;left:12px;font-size:12px;line-height:1.3;text-align:center;direction:ltr;padding:4px 8px;border-radius:6px}
.icons{inset:0;max-height:none;padding:0;display:block}
.ic{position:absolute;width:calc(84px*var(--z,1));font-size:calc(12px*var(--z,1));touch-action:none}
.ic .ico{width:calc(46px*var(--z,1))!important;height:calc(46px*var(--z,1))!important}
.apps{max-height:48vh;overflow:auto}
.tray{display:flex;align-items:center;gap:2px;cursor:default}.tt{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px}.tt:hover{background:var(--hover)}
.tt svg{width:16px;height:16px;fill:none;stroke:var(--txt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#clk{display:block;text-align:center}
#qs{position:absolute;bottom:60px;left:12px;width:280px;display:none;gap:8px;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:99999;font-size:13px}#qs.on{display:grid}#qs input[type=range]{width:100%;padding:0}
#cm{position:fixed;display:none;min-width:220px;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:999998;font-size:13px}
.mi{position:relative;display:flex;justify-content:space-between;gap:20px;padding:7px 12px;border-radius:5px;cursor:default;white-space:nowrap}.mi:hover{background:var(--hover)}.mi.d{opacity:.45;pointer-events:none}
.sep{height:1px;background:var(--line);margin:4px 8px}
.sub{display:none;position:absolute;top:-5px;right:100%;min-width:190px;background:var(--win);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.4)}.mi:hover>.sub{display:block}.fl .sub{right:auto;left:100%}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--win);color:var(--txt);border:1px solid var(--line);padding:8px 16px;border-radius:8px;z-index:9999999;font-size:13px}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:999999}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.win{border-radius:12px;animation:pop .16s ease}
.tb .ico{flex:none}
#wp{position:absolute;inset:0;width:100%;height:100%}
:root{--w1:#e3edf8;--w2:#bcd3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1:#07142b;--w2:#0f2f5f}}
:root[data-theme="dark"]{--w1:#07142b;--w2:#0f2f5f}
.apps{max-height:30vh}
.sh{font-size:13px;font-weight:600;margin:14px 4px 8px}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:6px}.rec div{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;font-size:13px}.rec div:hover{background:var(--hover)}.rec small{display:block;color:var(--sub);font-size:11px}
#lock{position:fixed;inset:0;z-index:99999999;display:grid;place-items:center;color:#fff;background:rgba(8,18,40,.35);backdrop-filter:blur(28px);transition:transform .5s ease,opacity .5s;text-align:center}
#lock.off{transform:translateY(-100%);opacity:0;pointer-events:none}
.lt{font-size:84px;font-weight:300;direction:ltr}.ld{font-size:20px;margin-top:4px}.lh{margin-top:40px;font-size:13px;opacity:.8}
.av{width:110px;height:110px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:48px;font-style:normal;margin:0 auto 14px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#lk2 input{width:240px;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);color:#fff;margin:14px 6px 0}
#lk2 input::placeholder{color:#ddd}#lk2 .b{margin-top:14px}#le{display:block;margin-top:10px;color:#ffb4a8}
#snp{position:absolute;display:none;background:color-mix(in srgb,var(--acc) 25%,transparent);border:2px solid var(--acc);border-radius:10px;z-index:99990;pointer-events:none}
.sg{display:flex;flex:1;min-height:0}.sn{width:170px;border-inline-end:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sn button{border:0;background:none;color:var(--txt);padding:10px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;text-align:start}.sn button:hover{background:var(--hover)}.sn button.on{background:var(--hover);box-shadow:inset -3px 0 var(--acc)}
.sc{flex:1;overflow:auto}.sc h3{margin:0 0 4px;font-size:18px}
#cp,#wg{position:absolute;bottom:60px;display:none;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:99999;font-size:13px}
#cp{left:12px;width:330px}#cp.on{display:block}#wg{right:12px;width:340px;max-height:72vh;overflow:auto}#wg.on{display:grid;gap:8px}
.card{background:var(--hover);border-radius:10px;padding:12px}
.nt{padding:8px 10px;border-radius:8px;background:var(--hover);margin-top:6px}.nt small{color:var(--sub);display:block}
#start{padding-inline-start:70px}.foot{display:none}
.rail{position:absolute;top:0;bottom:0;right:0;width:50px;background:var(--glass);backdrop-filter:blur(30px);border-radius:0 12px 12px 0;display:flex;flex-direction:column;padding:6px;gap:2px;z-index:2;transition:width .15s;overflow:hidden;border-inline-start:1px solid var(--line)}
.rail.ex{width:220px;background:var(--win)}
.rb{display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--txt);padding:11px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.rb:hover{background:var(--hover)}.rb svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--txt);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rl{display:none}.rail.ex .rl{display:inline}.rb.hd .rl{font-weight:700}
</style>
</head>
<body>
<div id="desk">
  <div class="icons" id="icons"></div>
  <div id="start"><input placeholder="ابحث عن تطبيق…" id="q"><div class="sh">مثبّت</div><div class="apps" id="apps"></div><div class="sh">مقترح</div><div class="rec" id="rec"></div>
    <div class="foot"><span><i style="width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal">م</i>مستخدم</span><span id="off"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>إعادة التحميل</span></div></div>
  <div id="bar"><button class="tk" id="wb" aria-label="الأدوات" style="position:absolute;right:10px"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:var(--txt);stroke-width:2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button><button class="tk" id="sb" aria-label="ابدأ"><i class="logo"><s></s><s></s><s></s><s></s></i></button><button class="tk" id="sr" aria-label="بحث"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:var(--txt);stroke-width:2;stroke-linecap:round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><span id="tasks" style="display:flex;gap:4px"></span><div class="tray" id="tray"><span class="tt" id="tbt"></span><span class="tt" id="tw"></span><span class="tt" id="tv"></span><span class="tt" id="tb"></span><span class="tt" id="clk"></span><span class="tt" id="nb"></span></div></div>
  <div id="qs"><div class="row"><span>الإنترنت</span><b id="qn"></b></div><div class="row"><span>البلوتوث</span><button class="g b" id="qbt"></button></div><div class="row" style="display:grid"><span>الصوت</span><input type="range" id="vl" min="0" max="100" value="60"><button class="g b" id="mu">كتم</button></div><div class="row" style="display:grid"><span>السطوع</span><input type="range" id="br" min="20" max="100" value="100"></div><div class="row"><span>البطارية</span><b id="bt"></b></div></div>
  <div id="cm"></div><div id="snp"></div>
  <div id="cp"><div class="card"><b id="cd" style="font-size:15px"></b></div><div class="bar" style="border:0;padding:8px 0"><button class="g b" id="cpv">›</button><b id="cmt" style="flex:1;text-align:center"></b><button class="g b" id="cnx">‹</button></div><div class="cal" id="cg" style="padding:0"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><b>الإشعارات</b><button class="g b" id="cclr">مسح الكل</button></div><div id="cn"></div></div>
  <div id="wg"><div class="card"><div id="wt" style="font-size:34px;direction:ltr"></div><div id="wd" style="color:var(--sub)"></div></div><div class="card"><b>ملاحظة سريعة</b><textarea id="wn" placeholder="اكتب ملاحظتك…" style="height:90px;margin-top:6px;background:var(--win);border-radius:8px"></textarea></div><div class="card"><b>حالة النظام</b><div id="ws" style="margin-top:6px;line-height:1.8"></div></div><div class="card"><b>وصول سريع</b><div class="apps" id="wq" style="margin-top:6px"></div></div></div>
</div>
<div id="lock"><div id="lk1"><div class="lt" id="lt"></div><div class="ld" id="ld"></div><div class="lh">انقر أو اضغط أي مفتاح للمتابعة</div></div><div id="lk2" style="display:none"><i class="av" id="lav"></i><b id="ln" style="font-size:22px"></b><div><input type="password" id="lp" placeholder="كلمة المرور"><button class="b" id="lg">تسجيل الدخول</button></div><small id="le"></small></div></div>
<div id="dim"></div>
<script>
const $=s=>document.querySelector(s);
const P={
notes:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
files:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
paint:'<path d="M12 19l7-7-3-3-7 7v3zM14 7l3 3M4 21c2 0 3-1 3-3"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 10l3 2-3 2M12 15h5"/>',
snake:'<rect x="3" y="8" width="18" height="10" rx="4"/><path d="M8 11v4M6 13h4M15 12h.01M17 14h.01"/>',
web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',

music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
xo:'<path d="M4 4l7 7M11 4l-7 7"/><circle cx="16" cy="16" r="4"/>',
todo:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',

cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',

bin:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/>'};
const G={notes:["#f7971e","#ffd200"],calc:["#4776e6","#8e54e9"],set:["#606c88","#3f4c6b"],files:["#f5a623","#f9d423"],paint:["#f857a6","#ff5858"],clock:["#11998e","#38ef7d"],cal:["#ee0979","#ff6a00"],term:["#232526","#555"],snake:["#56ab2f","#8bc34a"],web:["#2193b0","#6dd5ed"],doc:["#4776e6","#6dd5ed"],img:["#ee0979","#ff6a00"],music:["#7f00ff","#e100ff"],xo:["#00b4db","#0083b0"],todo:["#43cea2","#185a9d"],conv:["#f7971e","#e94057"],task:["#2c3e50","#4ca1af"],pass:["#134e5e","#71b280"],cam:["#8e2de2","#4a00e0"],mem:["#fc4a1a","#f7b733"],bin:["#3a7bd5","#00d2ff"]};
const ic=(k,s)=>`<span class="ico" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,${G[k][0]},${G[k][1]})"><svg viewBox="0 0 24 24">${P[k]}</svg></span>`;
const ST={g(k,d){try{const v=localStorage.getItem("w11_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){if(window.NOSAVE)return;try{localStorage.setItem("w11_"+k,JSON.stringify(v))}catch(e){}}};
const CFG=Object.assign({theme:"",acc:"",wp:0,z:1,vol:.6,muted:0,br:100,name:"مستخدم",pass:"",h24:0,tb:"center",pins:["files","web","notes","calc","paint","set"],note:""},ST.g("cfg",{}));

const A={

files:{t:"المستكشف",w:500,h:360,html:()=>'<div class="bar"><button class="g b" id="up">⬆ رجوع</button><b id="pth">الحاسوب</b></div><div class="files" id="fl"></div><div id="pv" style="padding:12px"></div>',

paint:{t:"الرسام",w:520,h:420,html:()=>'<div class="bar"><input type="color" id="c" value="#0067c0"><input type="range" id="s" min="1" max="30" value="4"><button class="g b" id="cl">مسح</button><button id="sv">حفظ في الصور</button></div><div style="padding:8px;overflow:auto"><canvas width="480" height="300"></canvas></div>',

clock:{t:"الساعة",w:380,h:380,html:()=>'<div class="big" id="n"></div><div class="pad"><div class="big" id="sw" style="font-size:32px">00:00.0</div><div class="sw" style="justify-content:center"><button class="b" id="go">ابدأ</button><button class="g b" id="rs">تصفير</button></div><div class="row"><span>مؤقت (دقائق)</span><input id="m" type="number" value="1" style="width:70px"><button class="b" id="tm">ابدأ</button></div><div id="tr" style="text-align:center"></div></div>',

cal:{t:"التقويم",w:420,h:380,html:()=>'<div class="bar"><button class="g b" id="pv">›</button><b id="mt" style="flex:1;text-align:center"></b><button class="g b" id="nx">‹</button></div><div class="cal" id="g"></div>',

term:{t:"موجه الأوامر",w:520,h:340,html:()=>'<div class="term"><div id="o">Web Win 11 [Version 1.0]\nاكتب help لعرض الأوامر\n</div><div>&gt; <input autofocus></div></div>',

snake:{t:"الثعبان",w:340,h:440,html:()=>'<div class="pad" style="justify-items:center"><b id="sc">النتيجة: 0</b><canvas width="300" height="300" style="background:#111"></canvas><div class="sw"><button class="b" data-d="-1,0">◀</button><button class="b" data-d="0,-1">▲</button><button class="b" data-d="0,1">▼</button><button class="b" data-d="1,0">▶</button></div><button class="b" id="st">ابدأ</button></div>',

  const go=()=>{s=[[10,10]];d=[1,0];f=[R(),R()];sc=0;clearInterval(t);t=setInterval(()=>{const h=[s[0][0]+d[0],s[0][1]+d[1]];
   if(h[0]<0||h[1]<0||h[0]>19||h[1]>19||s.some(p=>p[0]==h[0]&&p[1]==h[1])){clearInterval(t);w.q("#sc").textContent="انتهت! النتيجة: "+sc;return}
   s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;f=[R(),R()];w.q("#sc").textContent="النتيجة: "+sc}else s.pop();dr()},130)};
  w.q("#st").onclick=go;w.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const n=b.dataset.d.split(",").map(Number);if(d&&n[0]!=-d[0]||n[1]!=-d[1])d=n});

function setTB(v){CFG.tb=v;$("#bar").style.justifyContent=v=="start"?"flex-start":"center";$("#bar").style.paddingRight=v=="start"?"56px":"0"}
function upUser(){const n=CFG.name;$("#start .foot span").innerHTML=`<i style="width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal">${n[0]}</i>${n}`;$("#ln").textContent=n;const ru=$("#ru");if(ru)ru.textContent=n;$("#lav").textContent=n[0]}
function notify(t,m){NT.unshift({t,m,d:new Date()});toast(t+(m?" — "+m:""));rn()}
function rn(){$("#cn").innerHTML=NT.map(n=>`<div class="nt"><b>${n.t}</b><small>${n.m||""} · ${n.d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</small></div>`).join("")||'<div class="nt" style="color:var(--sub)">لا توجد إشعارات</div>';
 $("#nb").innerHTML='<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>'+(NT.length?`<span style="font-size:11px">${NT.length}</span>`:"")}
function rcal(){const y=cd.getFullYear(),m=cd.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),T=new Date();
 $("#cmt").textContent=cd.toLocaleDateString("ar",{month:"long",year:"numeric"});$("#cd").textContent=T.toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 $("#cg").innerHTML=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"].map(x=>`<b>${x}</b>`).join("")+"<span></span>".repeat(f)+Array.from({length:n},(_,i)=>`<span class="${T.getDate()==i+1&&T.getMonth()==m&&T.getFullYear()==y?"td":""}">${i+1}</span>`).join("")}
$("#cpv").onclick=()=>{cd.setMonth(cd.getMonth()-1);rcal()};$("#cnx").onclick=()=>{cd.setMonth(cd.getMonth()+1);rcal()};$("#cclr").onclick=()=>{NT.length=0;rn()};
function rw(){const d=new Date(),p=Math.round(bat.level*100);$("#wt").textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});$("#wd").textContent=d.toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"});
 $("#ws").innerHTML=`البطارية: ${p}%<br>الإنترنت: ${navigator.onLine?"متصل":"غير متصل"}<br>النوافذ المفتوحة: ${Object.keys(wins).length}<br>الملفات المحفوظة: ${Object.values(fs).reduce((a,o)=>a+Object.keys(o).length,0)}`}
$("#wq").innerHTML=["notes","calc","paint","set"].map(k=>`<div data-app="${k}">${ic(k,36)}${A[k].t}</div>`).join("");
$("#wn").value=CFG.note;$("#wn").oninput=e=>CFG.note=e.target.value;
$("#wb").onclick=()=>{$("#qs").classList.remove("on");$("#cp").classList.remove("on");rw();$("#wg").classList.toggle("on")};setInterval(()=>{if($("#wg").classList.contains("on"))rw()},5000);
function showSnap(sn){const e=$("#snp");if(!sn){e.style.display="none";return}const H="calc(100% - 56px)",o={l:["4px","4px","calc(50% - 8px)",H],r:["calc(50% + 4px)","4px","calc(50% - 8px)",H],t:["4px","4px","calc(100% - 8px)",H]}[sn];Object.assign(e.style,{display:"block",left:o[0],top:o[1],width:o[2],height:o[3]})}
function snapWin(w,sn){w._pre={w:w.style.width,h:w.style.height};w._snap=sn;if(sn=="t"){w.classList.add("max");return}Object.assign(w.style,{left:sn=="l"?"0":"50%",top:"0",width:"50%",height:"calc(100% - 48px)"})}
function lock(){$("#start").classList.remove("on");$("#lock").classList.remove("off");$("#lk1").style.display="block";$("#lk2").style.display="none";$("#lp").value="";$("#le").textContent=""}
function lk2(){$("#lk1").style.display="none";$("#lk2").style.display="block";$("#lp").style.display=CFG.pass?"":"none";$("#lp").focus()}
function login(){if(CFG.pass&&hs($("#lp").value)!=CFG.pass){$("#le").textContent="كلمة المرور غير صحيحة";return}$("#lock").classList.add("off");notify("مرحباً "+CFG.name,"تم تسجيل الدخول")}
function lkTick(){const d=new Date();$("#lt").textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});$("#ld").textContent=d.toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"})}
lkTick();setInterval(lkTick,5000);
$("#lock").addEventListener("click",()=>{if($("#lk1").style.display!="none")lk2()});
addEventListener("keydown",e=>{if($("#lock").classList.contains("off"))return;if($("#lk1").style.display!="none")lk2();else if(e.key=="Enter")login()});
$("#lg").onclick=login;$("#start .foot span").onclick=lock;
addEventListener("online",()=>notify("الإنترنت","تم الاتصال"));addEventListener("offline",()=>notify("الإنترنت","انقطع الاتصال"));
function saveAll(){CFG.theme=RT.dataset.theme||"";CFG.acc=RT.style.getPropertyValue("--acc");CFG.wp=wi%WPS.length;CFG.z=ZV;CFG.vol=vol;CFG.muted=muted?1:0;CFG.br=+$("#br").value;
 ST.s("cfg",CFG);ST.s("fs",fs);ST.s("trash",trash);ST.s("icons",[...document.querySelectorAll(".ic")].map(d=>({k:d.dataset.k,l:d.textContent,a:d.dataset.app,f:d.dataset.file||"",n:d.dataset.new||"",x:d.style.left,y:d.style.top})))}
setInterval(saveAll,1500);addEventListener("pagehide",saveAll);
if(CFG.theme)RT.dataset.theme=CFG.theme;if(CFG.acc)RT.style.setProperty("--acc",CFG.acc);
setWP(CFG.wp);setBr(CFG.br);setVol(Math.round(CFG.vol*100));muted=CFG.muted;setTB(CFG.tb);upUser();tr();rn();rcal();
CFG.bt=CFG.bt??1;CFG.btd=CFG.btd||[];const BTC={};
const bsv='<svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>';
function btr(){const n=Object.values(BTC).filter(d=>d.gatt&&d.gatt.connected).length;$("#tbt").innerHTML=CFG.bt?bsv+(n?`<span style="font-size:11px">${n}</span>`:""):"";$("#tbt").title="البلوتوث"+(n?" — "+n+" متصل":"");$("#qbt").textContent=CFG.bt?"مفعّل":"متوقف"}
function btToggle(){CFG.bt=CFG.bt?0:1;if(!CFG.bt)Object.values(BTC).forEach(d=>{try{d.gatt.disconnect()}catch(e){}});btr();notify("البلوتوث",CFG.bt?"تم التشغيل":"تم الإيقاف")}
async function btAdd(){if(!CFG.bt){toast("شغّل البلوتوث أولاً");return}
 if(!navigator.bluetooth){notify("البلوتوث","المتصفح لا يدعم Web Bluetooth");return}
 try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true}),id=d.id||d.name;if(!CFG.btd.some(x=>x.id==id))CFG.btd.push({id,n:d.name||"جهاز غير معروف"});BTC[id]=d;
  d.addEventListener("gattserverdisconnected",()=>{btr();notify("البلوتوث",(d.name||"الجهاز")+" انفصل");window.btRefresh&&btRefresh()});
  try{await d.gatt.connect();notify("البلوتوث","تم الاتصال بـ "+(d.name||"الجهاز"))}catch(e){notify("البلوتوث","تمت الإضافة لكن تعذّر الاتصال")}
  btr();window.btRefresh&&btRefresh()}catch(e){if(e.name!="NotFoundError")notify("البلوتوث","تعذّر البحث: "+(e.message||e.name))}}
$("#qbt").onclick=btToggle;btr();
function shut(){saveAll();const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000;color:#fff;display:grid;place-items:center;z-index:999999999;font-size:18px;cursor:pointer;text-align:center";d.innerHTML="<div>تم إيقاف التشغيل<br><small style='opacity:.6'>انقر لتشغيل الجهاز</small></div>";d.onclick=()=>location.reload();document.body.appendChild(d)}
(()=>{const g=p=>`<svg viewBox="0 0 24 24">${p}</svg>`,b=(k,p,t,c)=>`<button class="rb ${c||""}" data-r="${k}" title="${t}">${g(p)}<span class="rl">${t}</span></button>`;
$("#start").insertAdjacentHTML("afterbegin",`<div class="rail" id="rail">${b("menu",'<path d="M4 6h16M4 12h16M4 18h16"/>',"ابدأ","hd")}<span style="flex:1"></span>${b("user",'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',CFG.name).replace('class="rl"','class="rl" id="ru"')}${b("doc",P.doc,"المستندات")}${b("pic",P.img,"الصور")}${b("set",P.set,"الإعدادات")}${b("pow",'<path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/>',"الطاقة")}</div>`);
const R2=$("#rail");R2.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{const k=e.dataset.r,r=e.getBoundingClientRect();
 if(k=="menu"){R2.classList.toggle("ex");return}R2.classList.remove("ex");
 if(k=="doc"||k=="pic")openApp("files",{p:k=="doc"?"Documents":"Pictures"});
 else if(k=="set")openApp("set");
 else if(k=="user")showCM([{t:"تغيير إعدادات الحساب",fn:()=>{window.SEC="acc";openApp("set")}},{t:"قفل",fn:lock},{t:"تسجيل الخروج",fn:lock}],r.left,r.top);
 else showCM([{t:"قفل",fn:lock},{t:"إعادة التشغيل",fn:()=>location.reload()},{t:"إيقاف التشغيل",fn:shut}],r.left,r.top)})})();
</script>
